server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the Spring Boot service (docker-compose service name "backend")
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Server-sent events for live notifications: disable buffering
  location /api/notifications/stream {
    proxy_pass http://backend:8080/api/notifications/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # React Router: send unknown paths to index.html
  location / {
    try_files $uri /index.html;
  }
}
