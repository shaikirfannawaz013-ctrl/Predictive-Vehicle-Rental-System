# FleetIQ: full stack. Run `docker compose up --build`, then open http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleetiq
      POSTGRES_USER: fleetiq
      POSTGRES_PASSWORD: fleetiq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetiq -d fleetiq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]          # for a backend running on your machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fleetiq
      DB_USER: fleetiq
      DB_PASSWORD: fleetiq
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      ML_SERVICE_URL: http://ml-service:8000
      SEED_DATA: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      # JWT_SECRET: set a base64 secret (>= 32 bytes) outside development
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      ml-service: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCKS: "false"
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
